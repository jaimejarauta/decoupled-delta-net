[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm-scale-identifiability"
version = "0.1.0"
description = "Scale-Ratio Non-Identifiability in Universal Time-Series Foundation Models (Chronos-2 on fev-bench)."
authors = [{ name = "Jaime Jarauta", email = "jaime.jarauta@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.4",
    "lightgbm>=4.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
fev = ["chronos-forecasting>=2.0", "fev>=0.6.0", "datasets>=3.0", "pyarrow>=15.0"]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]

