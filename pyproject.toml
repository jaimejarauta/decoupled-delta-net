[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-witness-verify"
version = "0.1.0"
description = "Witness-Bottlenecked GRPO (WB-GRPO) for self-contained verification under hard derivation erasure."
authors = [{ name = "Jaime Jarauta", email = "jaime.jarauta@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "datasets>=3.0",
]

[project.optional-dependencies]
rl = ["peft>=0.12.0"]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

