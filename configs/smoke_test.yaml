# Decoupled Delta-Net Smoke Test Configuration
question: "Can decoupled delta recurrence with surprise error reservoir maintain associative recall at > 150 tok/s on CPU/MPS?"
date: "2026-10-25"

task:
  seq_len: 1024
  num_pairs: 8
  vocab_size: 256
  batch_size: 2
  seed: 2026

model:
  vocab_size: 256
  d_model: 64
  d_k: 32
  d_v: 32
  d_ff: 128
  num_layers: 2
  surprise_threshold: 0.50

pre_registered_rules:
  min_throughput_tok_s: 150.0
  max_latency_ms: 10.0
  max_surprise_rate: 0.35
  pass_rule: "throughput >= 150 tok/s and latency <= 10.0 ms"

